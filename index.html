<script>
async function startAudit() {
    const url = document.getElementById('urlInput').value;
    const siteType = document.getElementById('siteType').value;
    const btn = document.getElementById('auditBtn');
    const resultsDiv = document.getElementById('resultsArea');

    if(!url) return alert("Please enter a URL");

    btn.innerText = "Analyzing Risk...";
    btn.disabled = true;

    try {
        const response = await fetch('/api/scan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url, siteType })
        });
        
        const data = await response.json();
        
        // عرض النتائج في الصفحة
        resultsDiv.innerHTML = `
            <div class="result-card">
                <h3>Risk Level: <span style="color:red">${data.risk_level}</span></h3>
                <p>${data.summary}</p>
                <ul>${data.top_issues.map(i => `<li>${i}</li>`).join('')}</ul>
                <p><strong>Legal Note:</strong> ${data.legal_impact}</p>
                <a href="YOUR_BILLGANG_LINK" class="buy-btn">Get Full Legal Remediation Plan ($29)</a>
            </div>
        `;
    } catch (e) {
        alert("Check your API keys in Vercel!");
    } finally {
        btn.innerText = "Check Compliance";
        btn.disabled = false;
    }
}
</script>
